name: Tests

# Every push runs four jobs in parallel: the type-check, unit tests and build; the browser suite; the full
# playtest (every class through the story and the second walk of the Road); and the Hardcore Tabletop playtest. The fold audit is built into the
# browser suite (e2e/fixtures.ts): a test fails if a step clicks, sees or reads something inside a folded panel
# it did not open with reveal(). The playtest fails when any run does not reach its ending.
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Type-check, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  e2e:
    name: Browser tests with the fold audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tests drive the installed Google Chrome (playwright.config.ts, channel: 'chrome'). GitHub's Ubuntu
      # runners ship with it; install it only if it is missing.
      - name: Chrome
        run: google-chrome --version || npx playwright install --with-deps chrome

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the failure snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  playtest:
    name: Full playtest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Playtest (every class, then the second walk of the Road)
        # shell: bash sets pipefail, so a failing playtest is not hidden by tee.
        shell: bash
        run: npm run playtest -- ng | tee playtest.log

      # The run's summary page: the PLAYTEST line, and the per-class table folded underneath.
      - name: Playtest summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Playtest"
            echo
            grep '^PLAYTEST:' playtest.log || echo "PLAYTEST: no summary line (the playtest stopped early; see the log)."
            echo
            echo "<details><summary>Every run</summary>"
            echo
            echo '```'
            grep -E 'finished|stuck|lost|could not start|no main quest' playtest.log | grep -v '^PLAYTEST:' || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the playtest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playtest-log
          path: playtest.log
          retention-days: 7

  playtest-hardcore:
    name: Hardcore Tabletop playtest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Hardcore heroes under the Tabletop Rules: no Last Breath, so a hero at 0 HP dies outright (the case
      # that once crashed a boss's Throne Action). First walk of the Road only; falls carry on from the last save.
      - name: Playtest (every class, Hardcore, Tabletop Rules)
        shell: bash
        env:
          PLAYTEST_HARDCORE: '1'
        run: npm run playtest | tee playtest-hardcore.log

      - name: Playtest summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Hardcore Tabletop playtest"
            echo
            grep '^PLAYTEST:' playtest-hardcore.log || echo "PLAYTEST: no summary line (the playtest stopped early; see the log)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the playtest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playtest-hardcore-log
          path: playtest-hardcore.log
          retention-days: 7
